<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Finanzas personales con tu asistente de IA.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NeroMoney">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NeroMoney</title>
  <meta name="theme-color" content="#0A0D14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">

  <!--
    Aviso "¿Quieres instalar NeroMoney como acceso rápido?" (pedido del
    usuario). Va en HTML, encima del lienzo de Flutter, para aparecer en
    cualquier pantalla de la app. Chrome/Edge: botón que abre la instalación
    real (beforeinstallprompt). iPhone: Safari no permite ese botón, así que
    se explica cómo hacerlo a mano. Android: además, descargar el APK.
    "Ahora no" no vuelve a preguntar en 7 días; instalada, no aparece.
  -->
  <style>
    #nm-instalar {
      position: fixed; left: 50%; bottom: 20px; z-index: 2147483647;
      width: min(440px, calc(100vw - 24px)); box-sizing: border-box;
      transform: translate(-50%, 140%); opacity: 0;
      transition: transform .45s cubic-bezier(.3,1.25,.5,1), opacity .3s ease;
      font-family: Outfit, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff; background: rgba(18, 24, 38, .92);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .16); border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 30px rgba(0, 240, 255, .12);
      padding: 18px 18px 16px;
    }
    #nm-instalar.visible { transform: translate(-50%, 0); opacity: 1; }
    #nm-instalar .fila { display: flex; gap: 14px; align-items: center; }
    #nm-instalar img { width: 52px; height: 52px; border-radius: 14px; flex: none; }
    #nm-instalar h2, #nm-instalar h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
    #nm-instalar p { margin: 4px 0 0; font-size: 14px; color: #94a3b8; line-height: 1.4; }
    #nm-instalar .botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    #nm-instalar button, #nm-instalar a.boton {
      font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      border-radius: 999px; padding: 11px 20px; text-decoration: none;
      border: 1px solid rgba(255, 255, 255, .2); background: transparent; color: #cbd5e1;
    }
    #nm-instalar .principal { background: #00f0ff; border-color: #00f0ff; color: #0a0d14; }
    #nm-instalar .apk { display: none; margin-top: 12px; font-size: 14px; color: #94a3b8; text-align: center; }
    #nm-instalar .apk a { color: #00f0ff; font-weight: 600; text-decoration: none; }
    #nm-instalar .asa, #nm-instalar .cerrar, #nm-instalar .marca, #nm-instalar .lema { display: none; }
    #nm-instalar .principal svg { width: 20px; height: 20px; vertical-align: -4px; margin-right: 8px; }

    /* Teléfono: hoja inferior a todo lo ancho (diseño móvil del usuario). */
    @media (max-width: 600px) {
      #nm-instalar {
        left: 0; bottom: 0; width: 100vw;
        transform: translate(0, 110%);
        border-radius: 28px 28px 0 0; border-bottom: none;
        padding: 10px 22px calc(22px + env(safe-area-inset-bottom));
        text-align: center;
      }
      #nm-instalar.visible { transform: translate(0, 0); }
      #nm-instalar .asa {
        display: block; width: 44px; height: 5px; margin: 0 auto 14px;
        border-radius: 999px; background: rgba(255, 255, 255, .25);
      }
      #nm-instalar .cerrar {
        display: grid; place-items: center; position: absolute; top: 16px; right: 16px;
        width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1;
        border-radius: 50%; background: rgba(255, 255, 255, .06);
      }
      #nm-instalar .fila { flex-direction: column; gap: 10px; }
      #nm-instalar img {
        width: 76px; height: 76px; border-radius: 22px; margin-top: 8px;
        box-shadow: 0 0 28px rgba(0, 240, 255, .25);
      }
      #nm-instalar .marca { display: block; margin: 0; font-size: 26px; font-weight: 700; }
      #nm-instalar .lema { display: block; margin-top: 2px; font-size: 15px; color: #00f0ff; }
      #nm-instalar h3 { margin: 14px 0 0; font-size: 19px; font-weight: 600; line-height: 1.35; }
      #nm-instalar p { font-size: 15px; margin-top: 6px; }
      #nm-instalar .botones { flex-direction: column-reverse; gap: 10px; margin-top: 20px; }
      #nm-instalar button.principal, #nm-instalar button.secundario { width: 100%; padding: 15px 20px; font-size: 16px; border-radius: 18px; }
    }
  </style>
  <script>
    (function () {
      var CLAVE = 'nm_instalar_descartado';
      var SIETE_DIAS = 7 * 24 * 60 * 60 * 1000;
      var APK = 'https://github.com/xDaSerr/NeroMoneyApp/releases/latest/download/NeroMoney.apk';
      var ua = navigator.userAgent || '';
      var esIOS = /iphone|ipad|ipod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var esAndroid = /android/i.test(ua);
      var instalada = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      var evento = null;
      var mostrado = false;

      function descartadoHaceRato() {
        try {
          var cuando = Number(localStorage.getItem(CLAVE) || 0);
          return Date.now() - cuando < SIETE_DIAS;
        } catch (e) { return false; }
      }
      function recordarDescarte() {
        try { localStorage.setItem(CLAVE, String(Date.now())); } catch (e) {}
      }
      function ocultar() {
        var aviso = document.getElementById('nm-instalar');
        if (aviso) aviso.classList.remove('visible');
      }

      // modo: 'instalar' (hay botón real), 'ios' (instrucciones), 'apk' (solo APK)
      function mostrar(modo) {
        if (mostrado || instalada || descartadoHaceRato()) return;
        var aviso = document.getElementById('nm-instalar');
        if (!aviso) return;
        mostrado = true;
        var p = aviso.querySelector('p');
        var pregunta = aviso.querySelector('h3');
        var instalar = aviso.querySelector('.principal');
        var telefono = window.matchMedia('(max-width: 600px)').matches;
        if (telefono) {
          pregunta.textContent = '¿Quieres añadir NeroMoney a la pantalla de inicio de tu teléfono?';
          p.textContent = 'Ábrelo directamente desde su icono.';
        }
        if (modo === 'ios') {
          p.textContent = 'Toca el botón Compartir de Safari y luego «Agregar a inicio».';
          instalar.textContent = 'Entendido';
          instalar.onclick = function () { recordarDescarte(); ocultar(); };
        } else if (modo === 'apk') {
          p.textContent = 'Descarga la app para Android y ábrela como cualquier otra.';
          instalar.textContent = 'Descargar APK';
          instalar.onclick = function () { window.location.href = APK; ocultar(); };
        } else {
          if (telefono) {
            instalar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
              'stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/>' +
              '<path d="M12 8v8M8 12h8"/></svg>Añadir a inicio';
          }
          instalar.onclick = function () {
            ocultar();
            if (!evento) return;
            evento.prompt();
            evento.userChoice.finally(function () { evento = null; });
          };
        }
        if (esAndroid && modo !== 'apk') aviso.querySelector('.apk').style.display = 'block';
        aviso.querySelector('.secundario').onclick = function () { recordarDescarte(); ocultar(); };
        aviso.querySelector('.cerrar').onclick = function () { recordarDescarte(); ocultar(); };
        setTimeout(function () { aviso.classList.add('visible'); }, 50);
      }

      // Chrome/Edge avisan que la página se puede instalar: se guarda el
      // evento para lanzarlo desde nuestro botón (en vez de la barra del
      // navegador) y se pregunta unos segundos después de entrar.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        evento = e;
        setTimeout(function () { mostrar('instalar'); }, 2500);
      });
      window.addEventListener('appinstalled', function () {
        instalada = true;
        ocultar();
      });
      window.addEventListener('DOMContentLoaded', function () {
        if (esIOS) {
          setTimeout(function () { mostrar('ios'); }, 2500);
        } else if (esAndroid) {
          // Navegadores de Android sin instalación (ej. Firefox): al menos el APK.
          setTimeout(function () { if (!evento) mostrar('apk'); }, 5000);
        }
      });
    })();
  </script>
</head>
<body>
  <div id="nm-instalar" role="dialog" aria-live="polite" aria-label="Instalar NeroMoney">
    <div class="asa"></div>
    <button type="button" class="cerrar" aria-label="Cerrar">&times;</button>
    <div class="fila">
      <img src="icons/Icon-192.png" alt="">
      <div>
        <h2 class="marca">NeroMoney</h2>
        <div class="lema">Tu dinero, a un toque</div>
        <h3>¿Quieres instalar NeroMoney como acceso rápido?</h3>
        <p>Ábrela desde tu pantalla de inicio, como una app.</p>
      </div>
    </div>
    <div class="botones">
      <button type="button" class="secundario">Ahora no</button>
      <button type="button" class="principal">Instalar</button>
    </div>
    <div class="apk">¿Prefieres la app? <a href="https://github.com/xDaSerr/NeroMoneyApp/releases/latest/download/NeroMoney.apk">Descargar APK para Android</a></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
