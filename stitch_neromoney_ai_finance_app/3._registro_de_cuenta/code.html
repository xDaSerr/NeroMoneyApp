<!-- Brand Ambient Halo & Icon Emblem -->
<div class="flex flex-col items-center text-center mt-space-xs mb-space-xl relative">
<div class="relative w-20 h-20 flex items-center justify-center mb-space-sm">
<!-- Ambient Glow Behind Logo -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-secondary-container/40 to-primary-container/30 blur-xl"></div>
<!-- Brand Neon Glyph SVG inspired by user image -->
<div class="relative w-16 h-16 rounded-2xl bg-surface-container-lowest/80 backdrop-blur-md shadow-[0_4px_24px_rgba(0,0,0,0.6)] flex items-center justify-center p-space-xs">
<svg class="w-full h-full drop-shadow-[0_0_12px_rgba(0,240,255,0.45)]" viewbox="0 0 100 100">
<defs>
<lineargradient id="cyberNeon1" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00F0FF"></stop>
<stop offset="100%" stop-color="#7701D0"></stop>
</lineargradient>
<lineargradient id="cyberNeon2" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00D0FF"></stop>
<stop offset="60%" stop-color="#9333EA"></stop>
<stop offset="100%" stop-color="#FF2A85"></stop>
</lineargradient>
</defs>
<!-- Stylized dual 'N' intersecting lines with soft rounded caps -->
<line stroke="url(#cyberNeon1)" stroke-linecap="round" stroke-width="8" x1="28" x2="28" y1="24" y2="76"></line>
<line stroke="url(#cyberNeon1)" stroke-linecap="round" stroke-width="8" x1="28" x2="52" y1="36" y2="64"></line>
<line stroke="url(#cyberNeon2)" stroke-linecap="round" stroke-width="8" x1="52" x2="52" y1="24" y2="76"></line>
<line stroke="url(#cyberNeon2)" stroke-linecap="round" stroke-width="8" x1="52" x2="76" y1="36" y2="64"></line>
<line stroke="url(#cyberNeon2)" stroke-linecap="round" stroke-width="8" x1="76" x2="76" y1="36" y2="76"></line>
<!-- Vibrant top dot marker -->
<circle cx="76" cy="24" fill="#00F0FF" filter="drop-shadow(0 0 6px #00F0FF)" r="5.5"></circle>
</svg>
</div>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Crea tu cuenta</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-2xs max-w-xs">
      Gestiona tu dinero sin esfuerzo junto a tu IA
    </p>
</div>
<!-- Registration Form Matrix -->
<form class="flex flex-col gap-space-md w-full" id="signup-form" onsubmit="event.preventDefault()">
<!-- Input: Full Name -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-space-xs uppercase tracking-wider" for="fullName">
        Nombre completo
      </label>
<div class="relative flex items-center bg-surface-container-low/90 backdrop-blur-xl rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.25)] focus-within:shadow-[0_0_20px_rgba(0,240,255,0.18)] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-4 pointer-events-none">
          person
        </span>
<input class="w-full h-13 pl-12 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="fullName" name="fullName" placeholder="ej. Alejandro Morales" required="" type="text"/>
</div>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-space-xs uppercase tracking-wider" for="email">
        Correo electrónico
      </label>
<div class="relative flex items-center bg-surface-container-low/90 backdrop-blur-xl rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.25)] focus-within:shadow-[0_0_20px_rgba(0,240,255,0.18)] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-4 pointer-events-none">
          alternate_email
        </span>
<input class="w-full h-13 pl-12 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="email" name="email" placeholder="alejandro@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-space-xs uppercase tracking-wider" for="password">
        Contraseña
      </label>
<div class="relative flex items-center bg-surface-container-low/90 backdrop-blur-xl rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.25)] focus-within:shadow-[0_0_20px_rgba(0,240,255,0.18)] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-4 pointer-events-none">
          lock
        </span>
<input class="w-full h-13 pl-12 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="password" name="password" placeholder="Crea una contraseña segura" required="" type="password" value="NeroQuantum!2025"/>
<button aria-label="Ver contraseña" class="absolute right-3 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-space-xs bg-surface-container-lowest/60 rounded-lg p-space-xs backdrop-blur-md">
<div class="flex items-center justify-between mb-space-2xs">
<div class="flex items-center gap-space-2xs">
<span class="material-symbols-outlined text-[14px] text-primary-fixed-dim">verified_user</span>
<span class="font-label-code text-label-code text-on-surface-variant">Seguridad de clave</span>
</div>
<span class="font-label-code text-label-code text-primary-fixed-dim font-medium tracking-wide" id="strengthText">
            Muy segura
          </span>
</div>
<!-- 4-bar dynamic status meter -->
<div class="grid grid-cols-4 gap-1.5 h-1.5 w-full">
<div class="h-full rounded-full bg-primary-fixed-dim shadow-[0_0_8px_rgba(0,219,233,0.5)]"></div>
<div class="h-full rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,240,255,0.5)]"></div>
<div class="h-full rounded-full bg-secondary-fixed shadow-[0_0_8px_rgba(220,184,255,0.4)]"></div>
<div class="h-full rounded-full bg-secondary-container shadow-[0_0_10px_rgba(119,1,208,0.6)]"></div>
</div>
</div>
</div>
<!-- Input: Confirm Password -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-space-xs uppercase tracking-wider" for="confirmPassword">
        Confirmar contraseña
      </label>
<div class="relative flex items-center bg-surface-container-low/90 backdrop-blur-xl rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.25)] focus-within:shadow-[0_0_20px_rgba(0,240,255,0.18)] transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant absolute left-4 pointer-events-none">
          lock_clock
        </span>
<input class="w-full h-13 pl-12 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required="" type="password" value="NeroQuantum!2025"/>
<!-- Active Validation Check Indicator -->
<div class="absolute right-3 w-7 h-7 rounded-full bg-primary-container/15 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-primary-fixed-dim">
            check_circle
          </span>
</div>
</div>
</div>
<!-- Styled Terms & Conditions Agreement -->
<div class="mt-space-xs flex items-start gap-space-xs px-space-xs select-none">
<label class="relative flex items-center justify-center cursor-pointer mt-0.5">
<input checked="" class="peer sr-only" id="termsAgree" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-high transition-all peer-checked:bg-primary-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[14px] text-on-primary font-bold opacity-0 peer-checked:opacity-100 transition-opacity">
            check
          </span>
</div>
</label>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed cursor-pointer" for="termsAgree">
        Acepto los 
        <span class="text-primary-fixed-dim font-medium hover:underline">Términos de Servicio</span> 
        y la 
        <span class="text-primary-fixed-dim font-medium hover:underline">Política de Privacidad</span> 
        de NeroMoney.
      </label>
</div>
<!-- Primary Action: Neon CTA Button -->
<div class="mt-space-sm w-full">
<button class="group relative w-full h-14 rounded-full overflow-hidden flex items-center justify-center bg-gradient-to-r from-primary-container via-primary-fixed-dim to-secondary-container text-on-primary-fixed font-headline-sm text-headline-sm font-semibold tracking-tight shadow-[0_0_24px_rgba(0,240,255,0.35),0_8px_16px_rgba(119,1,208,0.25)] active:scale-[0.98] active:brightness-95 transition-all cursor-pointer" type="submit">
<span class="relative z-10 flex items-center gap-space-xs">
<span>Crear cuenta</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">
            arrow_forward
          </span>
</span>
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
</button>
</div>
</form>
<!-- Bottom Redirection Link -->
<div class="flex items-center justify-center gap-space-2xs mt-space-xl">
<span class="font-body-md text-body-md text-on-surface-variant">¿Ya tienes cuenta?</span>
<a class="font-body-md text-body-md text-primary-fixed-dim font-medium hover:text-primary transition-colors flex items-center gap-0.5" href="#login">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const strengthText = document.getElementById('strengthText');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        const icon = toggleBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        }
      });
    }

    if (passwordInput && strengthText) {
      passwordInput.addEventListener('input', (e) => {
        const len = e.target.value.length;
        if (len === 0) {
          strengthText.textContent = 'Introduce clave';
          strengthText.className = 'font-label-code text-label-code text-outline font-medium tracking-wide';
        } else if (len < 6) {
          strengthText.textContent = 'Débil';
          strengthText.className = 'font-label-code text-label-code text-error font-medium tracking-wide';
        } else if (len < 10) {
          strengthText.textContent = 'Moderada';
          strengthText.className = 'font-label-code text-label-code text-secondary-fixed font-medium tracking-wide';
        } else {
          strengthText.textContent = 'Muy segura';
          strengthText.className = 'font-label-code text-label-code text-primary-fixed-dim font-medium tracking-wide';
        }
      });
    }
  })();
</script></main></body></html>
